services:
  postgres:
    image: postgres:17-alpine
    container_name: hackcore-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hackcore
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  core-backend:
    build:
      context: ./core-backend
      dockerfile: Dockerfile
    container_name: hackcore-backend
    ports:
      - '4000:4000'
    environment:
      - PORT=4000
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/hackcore?schema=public
      - CORS_ORIGIN=http://localhost:5173
    depends_on:
      postgres:
        condition: service_healthy

  core-frontend:
    build:
      context: ./core-frontend
      dockerfile: Dockerfile
    container_name: hackcore-frontend
    ports:
      - '5173:80'
    depends_on:
      - core-backend

volumes:
  postgres_data:
